name: publish-clients

# Publish the Direct Connect client recipe airdcpp-webclient to cvcpkg.org under the cy-pca
# organisation, built from source here. Started by hand, on main only: bump upstream_version
# (cvc_revision for a packaging-only change), merge, then run this. eiskaltdcpp and the
# eiskaltdcpp-py columns are published from their own repositories (transfix/eiskaltdcpp,
# transfix/eiskaltdcpp-py), by each one's cvcpkg-publish.yml.
#
# The bundle is built as recipes-clients.yml builds it (ubuntu-22.04 for cvcpkg's glibc 2.35
# floor, GCC 12), with recipes/airdcpp-webclient/test.sh run on the staged tree before the pack,
# and its dependencies taken from cvcpkg.org only: a bundle must never need something the registry
# cannot give the person installing it. So it waits for leveldb and websocketpp to be on
# cvcpkg.org (cy-pca/cvcpkg#623). After publishing, it is installed from cvcpkg.org into an empty
# prefix and its test.sh runs again there.
#
# The token is the CVCPKG_PUBLISHER_TOKEN repository secret: a cvcpkg.org publisher that is a
# member of the cy-pca organisation. Only the publish step sees it. Without it the job builds, tests
# and packs, then fails before publishing anything. Nothing is uploaded as an artifact.
# cvcpkg publish skips a bundle the registry already has, so a second run is harmless.

on:
  workflow_dispatch:

concurrency:
  group: publish-clients
  cancel-in-progress: false

permissions:
  contents: read

env:
  CC: gcc-12
  CXX: g++-12

jobs:
  airdcpp-webclient:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cvcpkg
      - name: Dependencies (cvcpkg.org only)
        run: |
          set -euo pipefail
          for dep in leveldb websocketpp; do
            cvcpkg info "$dep" >/dev/null 2>&1 \
              || { echo "::error::$dep is not on cvcpkg.org yet (cy-pca/cvcpkg#623); publishing nothing"; exit 1; }
          done
          cvcpkg install-deps airdcpp-webclient --recipes-dir recipes \
            --prefix "$RUNNER_TEMP/prefix" --config release --link shared \
            --no-fallback-to-source --include-host-tools
      - name: Build, test and pack
        run: |
          set -euo pipefail
          cvcpkg pack airdcpp-webclient --local --recipes-dir recipes \
            --prefix "$RUNNER_TEMP/prefix" --config release --link shared --output-dir dist
          ls -l dist/
          n=$(ls dist/airdcpp-webclient-*-linux-x86_64-release-shared.tar.gz | wc -l)
          [ "$n" = 1 ] || { echo "::error::expected one airdcpp-webclient bundle, packed $n"; exit 1; }
      - name: Publish
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CVCPKG_TOKEN:-}" ]; then
            echo "::error::no CVCPKG_PUBLISHER_TOKEN secret: the bundle packed but was not published"
            exit 1
          fi
          cvcpkg publish dist/airdcpp-webclient-*.tar.gz --server https://cvcpkg.org --org cy-pca
          # The server-side recipe row (the package page, the dependency graph). An upsert.
          cvcpkg recipe push airdcpp-webclient --recipes-dir recipes --no-default-recipes \
            --server https://cvcpkg.org --org cy-pca
      - name: Install it from cvcpkg.org and test it there
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/check"
          cvcpkg install airdcpp-webclient --prefix "$check" --config release --link shared \
            --no-fallback-to-source
          CVC_INSTALL_DIR="$check" CVC_DEPS_PREFIX="$check" bash recipes/airdcpp-webclient/test.sh
