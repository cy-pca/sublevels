name: recipes-clients

# Builds the Direct Connect client recipes from source, as publish-clients.yml does, and throws the
# result away: airdcpp-webclient, eiskaltdcpp and the eiskaltdcpp-py columns (cp311, cp312,
# cp313). `cvcpkg pack` builds each one into the prefix, runs its recipes/<name>/test.sh on the
# staged tree (the daemon started from it, its API or JSON-RPC answered; the bindings imported and
# the core started), checks its globs, relocation and glibc floor, and archives it. Nothing is
# published or uploaded.
#
# ubuntu-22.04 with GCC 12: cvcpkg's linux bundles must start on glibc 2.35, so `cvcpkg pack`
# refuses one built on a newer glibc (24.04 has 2.39), and AirDC++ needs GCC 12 or newer for C++20.
#
# leveldb and websocketpp, which AirDC++ needs, are not on cvcpkg.org until cy-pca/cvcpkg#623
# merges and its recipes are built there. Until then install-deps builds them from that pull
# request's recipes (CVCPKG_DEPS_REF), overlaid with --recipes-dir; once cvcpkg.org has them the
# overlay is unused and can go. eiskaltdcpp is not on cvcpkg.org either until publish-clients.yml
# first runs, so each eiskaltdcpp-py column builds it from recipes/eiskaltdcpp the same way.
#
# GitHub-hosted runners only: this repository is public, and a pull request's workflows must
# never reach the self-hosted runners on catx-03.

on:
  pull_request:
    paths:
      - 'recipes/airdcpp-webclient/**'
      - 'recipes/eiskaltdcpp/**'
      - 'recipes/eiskaltdcpp-py*/**'
      - '.github/workflows/recipes-clients.yml'
  push:
    branches: [main]
    paths:
      - 'recipes/airdcpp-webclient/**'
      - 'recipes/eiskaltdcpp/**'
      - 'recipes/eiskaltdcpp-py*/**'
      - '.github/workflows/recipes-clients.yml'
  workflow_dispatch:

concurrency:
  group: recipes-clients-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # cy-pca/cvcpkg#623 (leveldb 1.23, websocketpp 0.8.2).
  CVCPKG_DEPS_REF: c237f44c8141730141cc1f25574593f83c834e46
  CC: gcc-12
  CXX: g++-12

jobs:
  airdcpp-webclient:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: leveldb and websocketpp recipes (cy-pca/cvcpkg#623)
        uses: actions/checkout@v4
        with:
          repository: cy-pca/cvcpkg
          ref: ${{ env.CVCPKG_DEPS_REF }}
          path: .cvcpkg-deps
          persist-credentials: false
          sparse-checkout: |
            recipes/_common
            recipes/leveldb
            recipes/websocketpp
      - uses: ./.github/actions/setup-cvcpkg
      - name: Dependencies (cvcpkg.org; leveldb and websocketpp from source until published)
        run: |
          set -euo pipefail
          "$CXX" --version | head -1
          cvcpkg install-deps airdcpp-webclient \
            --recipes-dir .cvcpkg-deps/recipes --recipes-dir recipes \
            --prefix "$RUNNER_TEMP/prefix" --config release --link shared \
            --fallback-to-source --include-host-tools
      - name: Build, test and pack
        run: |
          set -euo pipefail
          cvcpkg pack airdcpp-webclient --local \
            --recipes-dir .cvcpkg-deps/recipes --recipes-dir recipes \
            --prefix "$RUNNER_TEMP/prefix" --config release --link shared --output-dir dist
          ls -l dist/
          ls dist/airdcpp-webclient-2.14.0+cvc.*-linux-x86_64-release-shared.tar.gz

  eiskaltdcpp:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cvcpkg
      - name: msgfmt (the build compiles its message catalogues)
        run: command -v msgfmt || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends gettext; }
      - name: Dependencies (cvcpkg.org)
        run: |
          set -euo pipefail
          "$CXX" --version | head -1
          cvcpkg install-deps eiskaltdcpp --recipes-dir recipes \
            --prefix "$RUNNER_TEMP/prefix" --config release --link shared \
            --no-fallback-to-source --include-host-tools
      - name: Build, test and pack
        run: |
          set -euo pipefail
          cvcpkg pack eiskaltdcpp --local --recipes-dir recipes \
            --prefix "$RUNNER_TEMP/prefix" --config release --link shared --output-dir dist
          ls -l dist/
          ls dist/eiskaltdcpp-2.6.0+cvc.*-linux-x86_64-release-shared.tar.gz

  eiskaltdcpp-py:
    name: eiskaltdcpp-py-${{ matrix.abi }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [cp311, cp312, cp313]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cvcpkg
      - name: msgfmt (eiskaltdcpp's build compiles its message catalogues)
        run: command -v msgfmt || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends gettext; }
      # One prefix per column: the columns' build backends occupy the same slots.
      - name: Dependencies (cvcpkg.org; eiskaltdcpp from recipes/ until published)
        run: |
          set -euo pipefail
          cvcpkg install-deps "eiskaltdcpp-py-${{ matrix.abi }}" --recipes-dir recipes \
            --prefix "$RUNNER_TEMP/prefix" --config release --link shared \
            --fallback-to-source --include-host-tools
      - name: Build, test and pack
        run: |
          set -euo pipefail
          cvcpkg pack "eiskaltdcpp-py-${{ matrix.abi }}" --local --recipes-dir recipes \
            --prefix "$RUNNER_TEMP/prefix" --config release --link shared --output-dir dist
          ls -l dist/
          ls "dist/eiskaltdcpp-py-${{ matrix.abi }}-2.6.0+cvc."*-linux-x86_64-release-shared.tar.gz
