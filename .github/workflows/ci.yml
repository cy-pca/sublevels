name: ci

# The server's tests, on every push to main and every pull request:
#
#   unit    pytest on GitHub's Python 3.12 with fastapi, uvicorn, httpx and pytest from PyPI: the
#           service and the HTTP API. The tests that need pycvc skip here.
#   arisrvx arisrvx, pycvc-cp312 and the ASGI stack from cvcpkg.org (server/ci/install.sh), as an
#           operator installs them. pytest on cvcpkg's python3.12 with pycvc beside it (the Host
#           tests, `python -m sublevels.server` end to end, and the S7 ServerHarness tests: none may
#           skip), then server/ci/smoke.sh: the service in arisrvx, its room-call export
#           registered, /healthz, NMDC and NMDCS logins, SIGTERM, a clean exit.
#   package the cvcpkg recipe built into a prefix, and the installed `sublevels` command run in each
#           TX.WTF mode (server/ci/smoke-package.sh).
#   interop-ncdc  ncdc (Ubuntu's package) as a black box against the hub (server/interop/).
#   interop-airdcpp  the AirDC++ web client's portable release, through its documented HTTP API.
#   transfers  ncdc and AirDC++ download each other's files through the hub, over NMDC and NMDCS.
#   soak    6000 synthetic clients against the hub; memory, CPU and fan-out latency in the summary.
#
# GitHub-hosted runners only: this repository is public, and a pull request's workflows must
# never reach the self-hosted runners on catx-03.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fastapi, uvicorn, httpx and pytest (PyPI)
        run: python -m pip install --quiet fastapi uvicorn httpx pytest
      - name: pytest
        run: python -m pytest -rs

  arisrvx:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The Host and `python -m sublevels.server` tests must run here, never skip.
      SUBLEVELS_REQUIRE_PYCVC: '1'
      # And the ServerHarness tests (libcvc S7, in the set server/ci/install.sh pins).
      SUBLEVELS_REQUIRE_HARNESS: '1'
      # And the room bridge's harness test (arisrvx's bridged-users API, libcvc 4.0.2).
      SUBLEVELS_REQUIRE_BRIDGE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cvcpkg
      - name: Install arisrvx, pycvc and the ASGI stack (cvcpkg)
        run: bash server/ci/install.sh ~/sublevels-ci
      - name: pytest (cvcpkg's python3.12, pycvc beside it)
        working-directory: server
        run: ~/sublevels-ci/deps/bin/python3.12 -m pytest -rs -p no:cacheprovider
      - name: arisrvx smoke run
        run: bash server/ci/smoke.sh ~/sublevels-ci/deps/bin/arisrvx

  package:
    # The cvcpkg recipe (recipes/sublevels) built into a prefix beside arisrvx and pycvc from
    # cvcpkg.org, then the installed `sublevels` command run as a user runs it
    # (server/ci/smoke-package.sh): check, serve with the relay, NMDC, NMDCS and the HTTP API, logins
    # over both, a clean SIGTERM; once for each TX.WTF mode (the default, off, a separate URL, and a
    # stand-in txwtf served in the process).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cvcpkg
      - name: Install arisrvx, pycvc and the ASGI stack (cvcpkg)
        run: bash server/ci/install.sh ~/sublevels-ci
      - name: Build the sublevels recipe into the prefix
        run: |
          cvcpkg build sublevels --local --platform any --prefix ~/sublevels-ci/deps
          ~/sublevels-ci/deps/bin/sublevels version
      - name: sublevels, TX.WTF default (embedded if installed, else off)
        run: bash server/ci/smoke-package.sh ~/sublevels-ci/deps
      - name: sublevels --no-txwtf
        run: TXWTF_MODE=off bash server/ci/smoke-package.sh ~/sublevels-ci/deps
      - name: sublevels --txwtf URL
        run: TXWTF_MODE=https://tx.example bash server/ci/smoke-package.sh ~/sublevels-ci/deps
      - name: sublevels --txwtf embedded (a stand-in txwtf)
        run: TXWTF_MODE=stub bash server/ci/smoke-package.sh ~/sublevels-ci/deps

  interop-ncdc:
    # ncdc as Ubuntu packages it, run as a black box (server/interop/ncdc_interop.py): three ncdc
    # (active, NMDCS, passive) and an observer against the hub run alone, checking login, chat,
    # private messages, search and $SR, and file-list transfers by $ConnectToMe and
    # $RevConnectToMe. The hub's captures and the findings for spec/'s "To capture" items are kept.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ncdc and tmux (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ncdc tmux
          ncdc --version | head -1
      - name: ncdc interop
        run: python server/interop/ncdc_interop.py --out "$RUNNER_TEMP/interop"
      - name: Findings
        if: always()
        run: cat "$RUNNER_TEMP/interop/findings.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-ncdc
          path: ${{ runner.temp }}/interop
          retention-days: 14

  interop-airdcpp:
    # The AirDC++ web client's released portable build, run as a black box
    # (server/interop/airdcpp_interop.py): set up with its documented command-line options and
    # driven through its documented HTTP API, with an ncdc beside it, checking login, chat, /me,
    # private messages, search and results, and file-list transfers both ways.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AIRDCPP_URL: https://web-builds.airdcpp.net/stable/airdcpp_2.14.0_webui-2.14.0_64-bit_portable.tar.gz
      AIRDCPP_SHA256: fe89c40d1bbb11350e5e175f60ca9de325dbc6e5a778024429ba1bdf633bad1a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ncdc and tmux (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ncdc tmux
      - name: Download AirDC++ 2.14.0 (portable, checked)
        run: |
          mkdir -p "$RUNNER_TEMP/airdcpp"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/airdcpp.tar.gz" "$AIRDCPP_URL"
          echo "$AIRDCPP_SHA256  $RUNNER_TEMP/airdcpp.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/airdcpp.tar.gz" -C "$RUNNER_TEMP/airdcpp"
          "$RUNNER_TEMP/airdcpp/airdcpp-webclient/airdcppd" -v
      - name: AirDC++ interop
        run: |
          python server/interop/airdcpp_interop.py \
            --airdcppd "$RUNNER_TEMP/airdcpp/airdcpp-webclient/airdcppd" --out "$RUNNER_TEMP/interop"
      - name: Findings
        if: always()
        run: cat "$RUNNER_TEMP/interop/findings.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-airdcpp
          path: ${{ runner.temp }}/interop
          retention-days: 14

  transfers:
    # End-to-end file transfers through the hub (server/interop/transfers.py): ncdc (active and
    # passive) and the AirDC++ web client see each other and download each other's files, every
    # file checked by SHA-256, once over plain NMDC and once with every client over NMDCS
    # (keyprint-pinned) against a TLS-only hub.
    name: transfers (${{ matrix.hub }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hub: [nmdc, nmdcs]
    env:
      AIRDCPP_URL: https://web-builds.airdcpp.net/stable/airdcpp_2.14.0_webui-2.14.0_64-bit_portable.tar.gz
      AIRDCPP_SHA256: fe89c40d1bbb11350e5e175f60ca9de325dbc6e5a778024429ba1bdf633bad1a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ncdc and tmux (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ncdc tmux
      - name: Download AirDC++ 2.14.0 (portable, checked)
        run: |
          mkdir -p "$RUNNER_TEMP/airdcpp"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/airdcpp.tar.gz" "$AIRDCPP_URL"
          echo "$AIRDCPP_SHA256  $RUNNER_TEMP/airdcpp.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/airdcpp.tar.gz" -C "$RUNNER_TEMP/airdcpp"
      - name: Transfers
        run: |
          python server/interop/transfers.py ${{ matrix.hub == 'nmdcs' && '--tls' || '' }} \
            --airdcppd "$RUNNER_TEMP/airdcpp/airdcpp-webclient/airdcppd" --out "$RUNNER_TEMP/transfers"
      - name: Findings
        if: always()
        run: cat "$RUNNER_TEMP/transfers/findings.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transfers-${{ matrix.hub }}
          path: ${{ runner.temp }}/transfers
          retention-days: 14

  soak:
    # 6000 synthetic clients (D7) against the hub run alone (server/interop/soak.py): every client
    # must log in and stay connected. Memory per user, CPU and fan-out latency go to the summary.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Soak, 6000 users
        run: |
          ulimit -n 65536
          python server/interop/soak.py --users 6000 --workers 3 --ramp 300 --chat 30 --out "$RUNNER_TEMP/soak"
      - name: Results
        if: always()
        run: |
          { echo '## Soak'; echo '```json'
            python -c "import json,sys; r=json.load(open(sys.argv[1])); [r.pop(k, None) for k in ('samples',)]; print(json.dumps(r, indent=1))" "$RUNNER_TEMP/soak/soak.json"
            echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak
          path: ${{ runner.temp }}/soak
          retention-days: 14
