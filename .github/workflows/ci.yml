name: ci

# The server's tests, on every push to main and every pull request:
#
#   unit    pytest on GitHub's Python 3.12 with fastapi, uvicorn, httpx and pytest from PyPI: the
#           service and the HTTP API. The tests that need pycvc skip here.
#   arisrvx arisrvx, pycvc-cp312 and the ASGI stack from cvcpkg.org (server/ci/install.sh), as an
#           operator installs them. pytest on cvcpkg's python3.12 with pycvc beside it (the Host
#           tests, `python -m sublevels.server` end to end, and the S7 ServerHarness tests: none may
#           skip), then server/ci/smoke.sh: the service in arisrvx, its room-call export
#           registered, /healthz, NMDC and NMDCS logins, SIGTERM, a clean exit.
#   package the cvcpkg recipe built into a prefix, and the installed `sublevels` command run in each
#           TX.WTF mode (server/ci/smoke-package.sh).
#   interop-ncdc  ncdc (Ubuntu's package) as a black box against the hub (server/interop/).
#   interop-airdcpp  the AirDC++ web client's portable release, through its documented HTTP API.
#   interop-eiskaltdcpp  EiskaltDC++ through its JSON-lines driver (cvcpkg eiskaltdcpp-py-cp312),
#           over NMDC and NMDCS, with an operator's redirect and kick (P6).
#   airdcpp-webclient  cvcpkg's airdcpp-webclient package (its recipe is in
#           cy-pca/airdcpp-webclient), for the transfers jobs.
#   transfers  ncdc and that AirDC++ download each other's files through the hub, over NMDC and
#           NMDCS.
#   soak    6000 synthetic clients against the hub; memory, CPU, fan-out latency and the ceiling
#           (broadcasts per second to 6000) in the summary.
#   bridge-e2e  the room bridge through arisrvx's real host code: an Ariadne client (arigl) and an
#           NMDC client meet in the conference room and chat both ways.
#
# The interop, transfers, soak and bridge-e2e jobs run on both of the hub's plain-NMDC transports
# (SUBLEVELS_NMDC_TRANSPORT, set on every leg): asyncio, and libcvc's native connection engine
# (pycvc 4.0.9 from cvcpkg). The default, auto, is the engine where pycvc has it. NMDCS stays on asyncio either way until the engine has TLS (libcvc N3), so a leg's
# engine coverage is its plain-NMDC connections: interop-ncdc's ncdcA and ncdcC (ncdcB is NMDCS),
# interop-airdcpp, interop-eiskaltdcpp (nmdc) and transfers (nmdc) in full, and in
# interop-eiskaltdcpp (nmdcs) the redirect to the plain address, and in transfers (nmdcs) only
# the plain session the TLS-only hub turns away. The arisrvx job runs the socket tests on both and smokes the engine as
# arisrvx's own (host.net).
#
# GitHub-hosted runners only: this repository is public, and a pull request's workflows must
# never reach the self-hosted runners on catx-03.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fastapi, uvicorn, sqlalchemy, maxminddb, httpx and pytest (PyPI)
        run: python -m pip install --quiet fastapi uvicorn sqlalchemy maxminddb httpx pytest
      - name: pytest
        run: python -m pytest -rs

  arisrvx:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The Host and `python -m sublevels.server` tests must run here, never skip.
      SUBLEVELS_REQUIRE_PYCVC: '1'
      # And the ServerHarness tests (libcvc S7, in the set server/ci/install.sh pins).
      SUBLEVELS_REQUIRE_HARNESS: '1'
      # And the room bridge's harness test (arisrvx's bridged-users API), and the socket tests on
      # the native connection engine (libcvc 4.0.9).
      SUBLEVELS_REQUIRE_BRIDGE: '1'
      SUBLEVELS_REQUIRE_ENGINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cvcpkg
      - name: Install arisrvx, pycvc and the ASGI stack (cvcpkg)
        run: bash server/ci/install.sh ~/sublevels-ci
      - name: pytest (cvcpkg's python3.12, pycvc beside it)
        working-directory: server
        run: ~/sublevels-ci/deps/bin/python3.12 -m pytest -rs -p no:cacheprovider
      - name: arisrvx smoke run, the default transport (auto picks arisrvx's own engine, host.net)
        run: bash server/ci/smoke.sh ~/sublevels-ci/deps/bin/arisrvx
      - name: arisrvx smoke run, plain NMDC on asyncio (the fallback setting)
        run: SUBLEVELS_NMDC_TRANSPORT=asyncio bash server/ci/smoke.sh ~/sublevels-ci/deps/bin/arisrvx

  package:
    # The cvcpkg recipe (recipes/sublevels) built into a prefix beside arisrvx and pycvc from
    # cvcpkg.org, then the installed `sublevels` command run as a user runs it
    # (server/ci/smoke-package.sh): check, serve with the relay, NMDC, NMDCS and the HTTP API, logins
    # over both, a clean SIGTERM; once for each TX.WTF mode (the default, off, a separate URL, and a
    # stand-in txwtf served in the process).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cvcpkg
      - name: Install arisrvx, pycvc and the ASGI stack (cvcpkg)
        run: bash server/ci/install.sh ~/sublevels-ci
      - name: Build the sublevels recipe into the prefix
        run: |
          cvcpkg build sublevels --local --platform any --prefix ~/sublevels-ci/deps
          ~/sublevels-ci/deps/bin/sublevels version
      - name: sublevels, TX.WTF default (embedded if installed, else off)
        run: bash server/ci/smoke-package.sh ~/sublevels-ci/deps
      - name: sublevels --no-txwtf
        run: TXWTF_MODE=off bash server/ci/smoke-package.sh ~/sublevels-ci/deps
      - name: sublevels --txwtf URL
        run: TXWTF_MODE=https://tx.example bash server/ci/smoke-package.sh ~/sublevels-ci/deps
      - name: sublevels --txwtf embedded (a stand-in txwtf)
        run: TXWTF_MODE=stub bash server/ci/smoke-package.sh ~/sublevels-ci/deps

  interop-ncdc:
    # ncdc as Ubuntu packages it, run as a black box (server/interop/ncdc_interop.py): three ncdc
    # (active, NMDCS, passive) and an observer against the hub run alone, checking login, chat,
    # private messages, search and $SR, and file-list transfers by $ConnectToMe and
    # $RevConnectToMe. The hub's captures and the findings for spec/'s "To capture" items are kept.
    name: interop-ncdc (${{ matrix.transport }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        transport: [asyncio, engine]
    env:
      SUBLEVELS_NMDC_TRANSPORT: ${{ matrix.transport }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-cvcpkg
        if: matrix.transport == 'engine'
      - name: The engine (pycvc 4.0.9 from cvcpkg; the hub runs on its python)
        if: matrix.transport == 'engine'
        run: |
          bash server/ci/install.sh ~/sublevels-ci
          echo "PY=$HOME/sublevels-ci/deps/bin/python3.12" >> "$GITHUB_ENV"
      - name: Install ncdc and tmux (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ncdc tmux
          ncdc --version | head -1
      - name: ncdc interop
        run: ${PY:-python} server/interop/ncdc_interop.py --out "$RUNNER_TEMP/interop"
      - name: Findings
        if: always()
        run: cat "$RUNNER_TEMP/interop/findings.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-ncdc-${{ matrix.transport }}
          path: ${{ runner.temp }}/interop
          retention-days: 14

  interop-airdcpp:
    # The AirDC++ web client's released portable build, run as a black box
    # (server/interop/airdcpp_interop.py): set up with its documented command-line options and
    # driven through its documented HTTP API, with an ncdc beside it, checking login, chat, /me,
    # private messages, search and results, and file-list transfers both ways.
    name: interop-airdcpp (${{ matrix.transport }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        transport: [asyncio, engine]
    env:
      SUBLEVELS_NMDC_TRANSPORT: ${{ matrix.transport }}
      AIRDCPP_URL: https://web-builds.airdcpp.net/stable/airdcpp_2.14.0_webui-2.14.0_64-bit_portable.tar.gz
      AIRDCPP_SHA256: fe89c40d1bbb11350e5e175f60ca9de325dbc6e5a778024429ba1bdf633bad1a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-cvcpkg
        if: matrix.transport == 'engine'
      - name: The engine (pycvc 4.0.9 from cvcpkg; the hub runs on its python)
        if: matrix.transport == 'engine'
        run: |
          bash server/ci/install.sh ~/sublevels-ci
          echo "PY=$HOME/sublevels-ci/deps/bin/python3.12" >> "$GITHUB_ENV"
      - name: Install ncdc and tmux (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ncdc tmux
      - name: Download AirDC++ 2.14.0 (portable, checked)
        run: |
          mkdir -p "$RUNNER_TEMP/airdcpp"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/airdcpp.tar.gz" "$AIRDCPP_URL"
          echo "$AIRDCPP_SHA256  $RUNNER_TEMP/airdcpp.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/airdcpp.tar.gz" -C "$RUNNER_TEMP/airdcpp"
          "$RUNNER_TEMP/airdcpp/airdcpp-webclient/airdcppd" -v
      - name: AirDC++ interop
        run: |
          ${PY:-python} server/interop/airdcpp_interop.py \
            --airdcppd "$RUNNER_TEMP/airdcpp/airdcpp-webclient/airdcppd" --out "$RUNNER_TEMP/interop"
      - name: Findings
        if: always()
        run: cat "$RUNNER_TEMP/interop/findings.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-airdcpp-${{ matrix.transport }}
          path: ${{ runner.temp }}/interop
          retention-days: 14

  interop-eiskaltdcpp:
    # EiskaltDC++ 2.6.2 as a black box, through eiskaltdcpp-interop (the JSON-lines driver from
    # transfix/eiskaltdcpp-py, contract 1, cvcpkg's eiskaltdcpp-py-cp312;
    # server/interop/eiskaltdcpp_interop.py): an active and a passive client log in, see each
    # other, chat and send private messages both ways, and download each other's file by search
    # (SHA-256 checked); over NMDCS a wrong keyprint is refused. An operator (the repository's test
    # client, logging in with a password) redirects one with $OpForceMove and kicks the other
    # (P6); what EiskaltDC++ shows goes in the job summary.
    name: interop-eiskaltdcpp (${{ matrix.hub }}, ${{ matrix.transport }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hub: [nmdc, nmdcs]
        transport: [asyncio, engine]
    env:
      SUBLEVELS_NMDC_TRANSPORT: ${{ matrix.transport }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-cvcpkg
      - name: The engine (pycvc 4.0.9 from cvcpkg; the hub runs on its python)
        if: matrix.transport == 'engine'
        run: |
          bash server/ci/install.sh ~/sublevels-ci
          echo "PY=$HOME/sublevels-ci/deps/bin/python3.12" >> "$GITHUB_ENV"
      - name: EiskaltDC++ and its driver (cvcpkg eiskaltdcpp-py-cp312)
        run: |
          cvcpkg install eiskaltdcpp-py-cp312 --prefix "$RUNNER_TEMP/eiskalt"
          "$RUNNER_TEMP/eiskalt/bin/eiskaltdcpp-interop" --version
      - name: EiskaltDC++ interop
        run: |
          ${PY:-python} server/interop/eiskaltdcpp_interop.py ${{ matrix.hub == 'nmdcs' && '--tls' || '' }} \
            --driver "$RUNNER_TEMP/eiskalt/bin/eiskaltdcpp-interop" --out "$RUNNER_TEMP/eiskalt-out"
      - name: Findings
        if: always()
        run: cat "$RUNNER_TEMP/eiskalt-out/findings.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the captures and the driver logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-eiskaltdcpp-${{ matrix.hub }}-${{ matrix.transport }}
          path: ${{ runner.temp }}/eiskalt-out
          retention-days: 14

  airdcpp-webclient:
    # The AirDC++ web client the transfers jobs run: cvcpkg's airdcpp-webclient package (the recipe
    # in cy-pca/airdcpp-webclient, built from upstream's source), installed from cvcpkg.org with no
    # fallback to a source build. The installed prefix goes to the transfers jobs as an artifact.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cvcpkg
      - name: Install from cvcpkg.org
        run: |
          cvcpkg install airdcpp-webclient --prefix "$RUNNER_TEMP/airdcpp" --config release \
            --link shared --no-fallback-to-source
      - name: Check and hand on the prefix
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/airdcpp/bin/airdcppd" -v
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/airdcpp-webclient-prefix.tar.gz" airdcpp
          ls -l "$RUNNER_TEMP/airdcpp-webclient-prefix.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: airdcpp-webclient-prefix
          path: ${{ runner.temp }}/airdcpp-webclient-prefix.tar.gz
          retention-days: 3

  transfers:
    # End-to-end file transfers through the hub (server/interop/transfers.py): ncdc (active and
    # passive) and the AirDC++ web client (cvcpkg's airdcpp-webclient, from the job above) see each
    # other and download each other's files, every file checked by SHA-256, once over plain NMDC
    # and once with every client over NMDCS (keyprint-pinned) against a TLS-only hub.
    name: transfers (${{ matrix.hub }}, ${{ matrix.transport }})
    needs: airdcpp-webclient
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hub: [nmdc, nmdcs]
        transport: [asyncio, engine]
    env:
      SUBLEVELS_NMDC_TRANSPORT: ${{ matrix.transport }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-cvcpkg
        if: matrix.transport == 'engine'
      - name: The engine (pycvc 4.0.9 from cvcpkg; the hub runs on its python)
        if: matrix.transport == 'engine'
        run: |
          bash server/ci/install.sh ~/sublevels-ci
          echo "PY=$HOME/sublevels-ci/deps/bin/python3.12" >> "$GITHUB_ENV"
      - name: Install ncdc and tmux (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ncdc tmux
      - uses: actions/download-artifact@v4
        with:
          name: airdcpp-webclient-prefix
          path: ${{ runner.temp }}
      - name: AirDC++ (cvcpkg airdcpp-webclient)
        run: |
          tar -xzf "$RUNNER_TEMP/airdcpp-webclient-prefix.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/airdcpp/bin/airdcppd" -v
      - name: Transfers
        run: |
          ${PY:-python} server/interop/transfers.py ${{ matrix.hub == 'nmdcs' && '--tls' || '' }} \
            --airdcppd "$RUNNER_TEMP/airdcpp/bin/airdcppd" --out "$RUNNER_TEMP/transfers"
      - name: Findings
        if: always()
        run: cat "$RUNNER_TEMP/transfers/findings.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transfers-${{ matrix.hub }}-${{ matrix.transport }}
          path: ${{ runner.temp }}/transfers
          retention-days: 14

  soak:
    # 6000 synthetic clients (D7) against the hub run alone (server/interop/soak.py), on each of its
    # plain-NMDC transports: every client must log in and stay connected. Memory per user, CPU,
    # fan-out latency and the ceiling (2000 chat lines back to back; broadcasts per second to every
    # user) go to the summary.
    name: soak (${{ matrix.transport }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        transport: [asyncio, engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-cvcpkg
        if: matrix.transport == 'engine'
      - name: The engine (pycvc 4.0.9 from cvcpkg; the hub runs on its python)
        if: matrix.transport == 'engine'
        run: |
          bash server/ci/install.sh ~/sublevels-ci
          echo "PY=$HOME/sublevels-ci/deps/bin/python3.12" >> "$GITHUB_ENV"
      - name: Soak, 6000 users
        run: |
          ulimit -n 65536
          ${PY:-python} server/interop/soak.py --users 6000 --workers 3 --ramp 300 --chat 30 \
            --ceiling 2000 --transport ${{ matrix.transport }} --out "$RUNNER_TEMP/soak"
      - name: Results
        if: always()
        run: python server/ci/soak_summary.py "$RUNNER_TEMP/soak/soak.json" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ matrix.transport }}
          path: ${{ runner.temp }}/soak
          retention-days: 14

  bridge-e2e:
    # The room bridge through libcvc's real host code (server/interop/bridge_e2e.py): `sublevels
    # serve` (arisrvx 4.0.9, the bridged-users API) with an NMDC client "zed", and an Ariadne client
    # (arigl 4.0.9 in conference mode running server/interop/bridge_client.ari, under cvcpkg's Xvfb
    # and Mesa) in the same room: the room lists zed, chat goes both ways, and a direct message
    # gets its reply.
    name: bridge-e2e (${{ matrix.transport }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        transport: [asyncio, engine]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cvcpkg
      - name: Install arisrvx, pycvc and arigl 4.0.9, Xvfb and Mesa (cvcpkg)
        run: ARIGL=1 bash server/ci/install.sh ~/sublevels-ci
      - name: Xvfb
        run: |
          ~/sublevels-ci/deps/bin/Xvfb :99 -screen 0 1280x1024x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 50); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
          [ -e /tmp/.X11-unix/X99 ] || { cat "$RUNNER_TEMP/xvfb.log"; exit 1; }
          printf '%s\n' DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe >> "$GITHUB_ENV"
      - name: The room bridge, end to end
        run: |
          ~/sublevels-ci/deps/bin/python3.12 server/interop/bridge_e2e.py \
            --prefix ~/sublevels-ci/deps --transport ${{ matrix.transport }} --out "$RUNNER_TEMP/bridge"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-e2e-${{ matrix.transport }}
          path: ${{ runner.temp }}/bridge
          retention-days: 14
