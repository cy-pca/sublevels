[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sublevels"
version = "0.1.0"
description = "A Direct Connect hub for the Ariadne stack, run as an arisrvx service"
readme = "README.md"
license = { text = "MIT" }
# arisrvx embeds CPython 3.12 (cvcpkg's python312), so the service targets it.
requires-python = ">=3.12,<3.13"
# pycvc (pycvc.ariadne: Host, serve_asgi, export) is not on PyPI. arisrvx carries pycvc.ariadne
# built in; under plain python it comes from cvcpkg's pycvc-cp312.
dependencies = ["fastapi", "uvicorn", "sqlalchemy", "maxminddb"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sublevels = ["nmdc/README.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "tools"]
testpaths = ["tests"]
